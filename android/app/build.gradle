apply plugin: 'com.android.application'

import java.util.Properties

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('keystore.properties')
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

def releaseSigningValue = { String propertyName, String environmentName ->
    return releaseSigningProperties.getProperty(propertyName) ?: System.getenv(environmentName)
}

def releaseStoreFilePath = releaseSigningValue('storeFile', 'ERUDITE_UPLOAD_STORE_FILE')
def releaseStorePassword = releaseSigningValue('storePassword', 'ERUDITE_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = releaseSigningValue('keyAlias', 'ERUDITE_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = releaseSigningValue('keyPassword', 'ERUDITE_UPLOAD_KEY_PASSWORD')
def missingReleaseSigningValues = {
    def missing = []
    if (!releaseStoreFilePath) {
        missing << 'storeFile / ERUDITE_UPLOAD_STORE_FILE'
    } else if (!rootProject.file(releaseStoreFilePath).isFile()) {
        missing << "upload keystore file (${releaseStoreFilePath})"
    }
    if (!releaseStorePassword) missing << 'storePassword / ERUDITE_UPLOAD_STORE_PASSWORD'
    if (!releaseKeyAlias) missing << 'keyAlias / ERUDITE_UPLOAD_KEY_ALIAS'
    if (!releaseKeyPassword) missing << 'keyPassword / ERUDITE_UPLOAD_KEY_PASSWORD'
    return missing
}

android {
    namespace = "com.erudite.flashcards"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.erudite.flashcards"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStoreFilePath) storeFile rootProject.file(releaseStoreFilePath)
            if (releaseStorePassword) storePassword releaseStorePassword
            if (releaseKeyAlias) keyAlias releaseKeyAlias
            if (releaseKeyPassword) keyPassword releaseKeyPassword
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

tasks.configureEach {
    if (name == 'preReleaseBuild') {
        doFirst {
            def missing = missingReleaseSigningValues()
            if (!missing.isEmpty()) {
                throw new GradleException(
                    "Release signing is not configured. Missing: ${missing.join(', ')}. " +
                    "Copy android/keystore.properties.example to android/keystore.properties, or supply the ERUDITE_UPLOAD_* environment variables."
                )
            }
        }
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
