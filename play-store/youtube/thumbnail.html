<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YouTube thumbnail</title>
<style>
  @font-face { font-family: "Geist"; font-weight: 100 900; src: url("../showreel/public/geist.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("../showreel/public/serif-italic.woff2") format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 500; src: url("../showreel/public/mono.woff2") format("woff2"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body {
    position: relative;
    background: #fcfcfb;
    color: #0b0d12;
    font-family: "Geist", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Soft colour from the logo, very faint. */
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(520px 320px at 38% 46%, rgba(45, 100, 255, 0.11), transparent 70%),
      radial-gradient(520px 320px at 64% 54%, rgba(22, 214, 200, 0.10), transparent 70%);
  }
  /* Fine grid that fades out towards the edges. */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(15, 23, 42, 0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15, 23, 42, 0.055) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px 11px;
    -webkit-mask-image: radial-gradient(760px 460px at 50% 50%, #000 30%, transparent 85%);
    mask-image: radial-gradient(760px 460px at 50% 50%, #000 30%, transparent 85%);
  }
  .grain {
    position: absolute;
    inset: 0;
    opacity: 0.35;
    background-size: 200px 200px;
    mix-blend-mode: multiply;
  }
  svg.curves { position: absolute; inset: 0; }
  .center {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    align-content: center;
    text-align: center;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 10px 24px 10px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.85);
    box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.08), 0 8px 24px rgba(15, 23, 42, 0.06);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .brand img { width: 46px; height: 46px; }
  h1 {
    margin: 34px 0 0;
    font-size: 118px;
    font-weight: 680;
    letter-spacing: -0.058em;
    line-height: 0.98;
  }
  h1 em {
    font-family: "Instrument Serif", serif;
    font-style: italic;
    font-weight: 400;
    font-size: 138px;
    letter-spacing: -0.02em;
    background: linear-gradient(95deg, #2d64ff 10%, #14b8b0 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding-right: 8px;
  }
  .tag {
    margin-top: 30px;
    font-family: "Geist Mono", monospace;
    font-size: 20px;
    letter-spacing: 0.14em;
    color: rgba(11, 13, 18, 0.5);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <!-- Memory fading away (grey, dashed) vs. spaced reviews keeping it high (brand gradient). -->
  <svg class="curves" viewBox="0 0 1280 720" aria-hidden="true">
    <defs>
      <linearGradient id="brand" x1="0" x2="1">
        <stop offset="0" stop-color="#2d64ff" stop-opacity="0.08" />
        <stop offset="0.35" stop-color="#2d64ff" stop-opacity="0.45" />
        <stop offset="1" stop-color="#14b8b0" stop-opacity="0.55" />
      </linearGradient>
      <linearGradient id="fade" x1="0" x2="1">
        <stop offset="0" stop-color="#0b0d12" stop-opacity="0.28" />
        <stop offset="1" stop-color="#0b0d12" stop-opacity="0.05" />
      </linearGradient>
    </defs>
    <path id="forget" fill="none" stroke="url(#fade)" stroke-width="2" stroke-dasharray="5 9" stroke-linecap="round" />
    <path id="srs" fill="none" stroke="url(#brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <g id="dots"></g>
  </svg>

  <div class="center">
    <div class="brand"><img src="../../assets/icons/icon.png" alt="">Erudite Flashcards</div>
    <h1>Study less.<br><em>Remember more.</em></h1>
    <div class="tag">ACTIVE RECALL · SPACED REPETITION</div>
  </div>
  <div class="grain" id="grain"></div>

<script>
  // Curves along the bottom third: an exponential forgetting curve, and a
  // sawtooth that is topped up at each review and decays more slowly each time.
  const X0 = 40, X1 = 1240, TOP = 600, BOT = 704;
  const y = v => BOT - (BOT - TOP) * v;
  const x = t => X0 + (X1 - X0) * t;
  let forget = '';
  for (let i = 0; i <= 200; i++) {
    const t = i / 200;
    forget += `${i ? 'L' : 'M'}${x(t).toFixed(1)},${y(Math.exp(-t * 7)).toFixed(1)}`;
  }
  document.getElementById('forget').setAttribute('d', forget);
  const reviews = [0, 0.1, 0.24, 0.44, 0.7, 1.01];
  let srs = '';
  const dots = [];
  for (let r = 0; r < reviews.length - 1; r++) {
    const a = reviews[r], b = reviews[r + 1];
    const k = 9 / Math.pow(2.2, r);
    for (let i = 0; i <= 40; i++) {
      const t = a + (b - a) * (i / 40);
      const v = 0.95 * Math.exp(-(t - a) * k);
      srs += `${srs ? 'L' : 'M'}${x(t).toFixed(1)},${y(Math.max(v, 0.02)).toFixed(1)}`;
    }
    if (r < reviews.length - 2) dots.push(x(b));
  }
  document.getElementById('srs').setAttribute('d', srs);
  document.getElementById('dots').innerHTML = dots
    .map(px => `<circle cx="${px}" cy="${y(0.95)}" r="4" fill="#fff" stroke="#2d64ff" stroke-width="2" stroke-opacity="0.5" />`)
    .join('');

  // Paper grain.
  const size = 200, canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d'), img = ctx.createImageData(size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random();
    img.data[i] = img.data[i + 1] = img.data[i + 2] = 60;
    img.data[i + 3] = Math.round(Math.pow(v, 3) * 26);
  }
  ctx.putImageData(img, 0, 0);
  document.getElementById('grain').style.backgroundImage = `url(${canvas.toDataURL()})`;
</script>
</body>
</html>
